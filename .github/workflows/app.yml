name: app

# test   -> pytest + build da imagem (sem Azure); roda em push, PR e manualmente
# deploy -> push da imagem no ACR e atualização do Container App (só na main)
#
# O deploy exige que a infraestrutura exista (workflow "infra", action = apply).
# Se o ACR não existir, o job termina com um aviso em vez de falhar.
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**"]
  workflow_dispatch:

permissions:
  id-token: write # token OIDC para entrar na Azure sem segredo
  contents: read

env:
  APP_RG: rg-azstudy-dev

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Testes
        working-directory: app
        run: |
          pip install -r requirements-dev.txt
          pytest -q
      - name: Build da imagem (sem push)
        run: docker build -t study-api:ci app/

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Descobrir o ACR
        run: |
          ACR=$(az acr list -g "$APP_RG" --query "[0].name" -o tsv)
          if [ -z "$ACR" ]; then
            echo "::warning::Nenhum ACR em $APP_RG. Rode o workflow infra (apply) antes do deploy."
          else
            echo "ACR=$ACR" >> "$GITHUB_ENV"
            echo "LOGIN=$(az acr show -n "$ACR" --query loginServer -o tsv)" >> "$GITHUB_ENV"
          fi

      - name: Build e push (login no ACR por token da identidade, sem senha)
        if: env.ACR != ''
        run: |
          az acr login --name "$ACR"
          docker build -t "$LOGIN/study-api:${GITHUB_SHA::7}" app/
          docker push "$LOGIN/study-api:${GITHUB_SHA::7}"

      - name: Atualizar o Container App
        if: env.ACR != ''
        run: |
          az extension add --name containerapp --only-show-errors
          az containerapp update -n ca-study-api -g "$APP_RG" \
            --image "$LOGIN/study-api:${GITHUB_SHA::7}"
