name: diag

# Diagnóstico temporário: isola o login OIDC, o acesso ao state e o terraform init.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 1) Login OIDC com o Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: 2) Quem sou eu
        run: az account show --query "{tipo:user.type, estado:state}" -o table

      - name: 3) Acesso de dados ao container do state (papel Storage Blob Data)
        run: |
          timeout 90 az storage blob list --account-name "${{ vars.TF_STATE_SA }}" \
            --container-name tfstate --auth-mode login --query "length(@)" -o tsv \
            && echo "acesso ao state ok" || echo "FALHOU ou estourou 90s (código $?)"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: 4) terraform init com log filtrado (limite de 2 min)
        working-directory: infra
        env:
          TF_LOG: DEBUG
        run: |
          set +e
          timeout 120 terraform init -input=false -no-color \
            -backend-config="storage_account_name=${{ vars.TF_STATE_SA }}" 2>&1 \
            | sed -E 's/eyJ[A-Za-z0-9._-]+/***JWT***/g' \
            | grep -iE "error|retry|retrying|status|403|401|404|oidc|backend|initializ" \
            | cut -c1-300 | head -60
          echo "terraform saiu com código ${PIPESTATUS[0]}"
